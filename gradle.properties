org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
systemProp.robolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2
org.gradle.configuration-cache=true
org.gradle.daemon=true
# Skip probing broken x86 JDKs registered under ~/Library/Java (Bad CPU type on Apple Silicon).
# Toolchains still come from JAVA_HOME, gradle-daemon-jvm (foojay), and explicit paths.
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.fromEnv=JAVA_HOME
android.useAndroidX=true
kotlin.code.style=official
android.defaults.buildfeatures.resvalues=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=false
android.enableAppCompileTimeRClass=false
android.usesSdkInManifest.disallowed=false
android.uniquePackageNames=false
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
android.builtInKotlin=true
android.newDsl=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Global developer settings toggle (full flavor only; playstore forces false)
debug_dev=true
