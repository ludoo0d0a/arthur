name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Project-scoped secrets → env. Kept here, not in geoking-ci.
env:
  GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
  WEB_CLIENT_ID: ${{ secrets.WEB_CLIENT_ID }}
  REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  UNSPLASH_SECRET_KEY: ${{ secrets.UNSPLASH_SECRET_KEY }}
  PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
  COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
  EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
  HARVARD_API_KEY: ${{ secrets.HARVARD_API_KEY }}
  SMITHSONIAN_API_KEY: ${{ secrets.SMITHSONIAN_API_KEY }}
  DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}
  DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}
  DEBUG_DEV: ${{ secrets.DEBUG_DEV }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout geoking-ci
        uses: actions/checkout@v4
        with:
          repository: ludoo0d0a/geoking-ci
          path: geoking-ci

      - name: Checkout geoking-tools
        uses: actions/checkout@v4
        with:
          repository: ludoo0d0a/geoking-tools
          path: geoking-tools

      - name: Setup Gradle
        uses: ./geoking-ci/actions/gk-setup-gradle
        with:
          gradle-version: wrapper
          java-version: '21'

      - name: Write google-services.json (optional on fork PRs)
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON not set; assemble without Firebase."
            exit 0
          fi
          bash geoking-ci/scripts/write-google-services.sh androidApp/google-services.json

      - name: Assemble debug APK
        env:
          GK_TOOLS: ${{ github.workspace }}/geoking-tools
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arthur-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
