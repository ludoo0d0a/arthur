name: Release to Play Store

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      track:
        description: 'Play Store track'
        default: internal
        type: choice
        options: [ internal, alpha, beta, production ]
      changesNotSentForReview:
        description: 'Skip auto-review (only for brand-new apps before first Console review)'
        default: false
        type: boolean
      cancelLastRunningAction:
        description: 'Cancel any in-progress run of this workflow'
        default: true
        type: boolean

# One pipeline: unit tests → signed AAB → Play. Cancelling supersedes older runs
# (saves Actions minutes when pushing/dispatching again quickly).
concurrency:
  group: play-release
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.cancelLastRunningAction }}

jobs:
  release:
    uses: ludoo0d0a/geoking-ci/.github/workflows/release-play.yml@main
    with:
      package_name: fr.geoking.arthur
      gradle_version: wrapper
      gradle_module: ':androidApp'
      aab_glob: 'androidApp/build/outputs/bundle/release/androidApp-release.aab'
      google_services_path: 'androidApp/google-services.json'
      unit_test_tasks: >-
        :shared:testDebugUnitTest
        :fractal:testDebugUnitTest
        :genart:testDebugUnitTest
        :androidApp:testDebugUnitTest
      is_workflow_dispatch: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
      workflow_dispatch_track: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.track || '' }}
      workflow_dispatch_skip_review: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.changesNotSentForReview == 'true' && 'true' || 'false' }}
      version_name_override: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit
