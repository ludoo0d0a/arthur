name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'wrangler.jsonc'
      - '.github/workflows/cloudflare-pages.yml'
  workflow_dispatch:

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '04efa4000e37d6c1df300af5da041485' }}
          command: deploy
          wranglerVersion: "4"
